name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Before the suites: verify-package asks vsce what would ship, and vsce
      # reports what is on disk without running the prepublish build. Without
      # this the bundle is simply absent and the check cannot say anything.
      - run: npm run build
      # The fast suites are hermetic — they stub `vscode` and alias the SDK out,
      # so CI needs no Claude credentials.
      - run: npm run verify:fast
      - run: npx vsce package --no-dependencies --out cadre.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: cadre-vsix
          path: cadre.vsix
