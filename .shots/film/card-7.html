<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0b0e14; }
  body {
    font-family: "Segoe UI", "Noto Sans", "DejaVu Sans", system-ui, sans-serif;
    color: #e6edf3;
    -webkit-font-smoothing: antialiased;
  }
  /* A slow radial wash so a flat card is not a flat rectangle of one colour. */
  .stage {
    position: relative; width: 100%; height: 100%;
    background:
      radial-gradient(900px 520px at 50% 34%, #131a26 0%, #0b0e14 68%),
      radial-gradient(circle at 1px 1px, #1b2432 1px, transparent 0) 0 0 / 26px 26px;
  }
  .headline {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 46px; font-weight: 650; letter-spacing: -0.022em; line-height: 1.15;
  }
  .sub {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 20px; font-weight: 400; color: #8b949e; letter-spacing: 0;
  }
  .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; }

  .box {
    position: absolute; width: 208px; height: 84px; border-radius: 12px;
    background: linear-gradient(180deg, #1a212c 0%, #161b22 100%);
    border: 1px solid #2b3440;
    padding: 13px 15px 0 17px; box-sizing: border-box;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42);
  }
  /* The accent is a bar, not a border, so it reads at a glance on a phone. */
  .box::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px;
    border-radius: 0 3px 3px 0; background: var(--accent, #8b949e);
  }
  .box b { display: block; font-size: 17px; font-weight: 620; letter-spacing: -0.01em; }
  .box span { display: block; font-size: 12.5px; color: #8b949e; margin-top: 5px; line-height: 1.4; }
  .box.lit {
    border-color: color-mix(in srgb, var(--accent) 55%, #2b3440);
    box-shadow: 0 10px 26px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent),
                0 0 30px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .dim { opacity: 0.22; }

  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .wire { fill: none; stroke-width: 2.5; }
  .wire.solid { stroke: #60a5fa; }
  .wire.dash { stroke: #4ade80; stroke-dasharray: 9 7; }
  .wire.live { stroke: #fbbf24; stroke-width: 4.5; stroke-dasharray: 11 8;
               filter: drop-shadow(0 0 7px rgba(251,191,36,.6)); }
  .wire.faint { opacity: 0.16; }

  .brand {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 74px; font-weight: 750; letter-spacing: 0.2em;
    background: linear-gradient(92deg, #a78bfa, #22d3ee 46%, #60a5fa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .rule {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 120px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #a78bfa, transparent);
  }
</style></head><body><div class="stage">
  <div class="headline" style="top:56px">They work as a team.</div>
  <svg><defs>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
  </marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
  </marker>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
  </marker></defs>
    <path class="wire live" marker-end="url(#a)" d="M 292 236 C 372 236, 404 178, 484 178"/>
    <path class="wire live" marker-end="url(#a)" d="M 292 256 C 372 256, 404 330, 484 330"/>
    <path class="wire dash" marker-end="url(#g)" d="M 692 178 C 772 178, 804 236, 884 236"/>
    <path class="wire solid" marker-end="url(#b)" d="M 692 350 C 772 350, 804 420, 884 420"/>
    <path class="wire solid" marker-end="url(#b)" d="M 484 400 C 424 400, 404 300, 484 300"/>
    <path class="wire dash" marker-end="url(#g)" d="M 884 460 C 804 460, 772 396, 692 396"/>
  </svg>
  <div class="box lit" style="left:84px;top:204px;--accent:#a78bfa">
     <b>Lead</b></div>
  <div class="box lit" style="left:484px;top:136px;--accent:#60a5fa">
     <b>Architect</b></div>
  <div class="box lit" style="left:484px;top:288px;--accent:#22d3ee">
     <b>Research</b></div>
  <div class="box lit" style="left:484px;top:400px;--accent:#fbbf24">
     <b>Implementer</b></div>
  <div class="box " style="left:884px;top:194px;--accent:#f472b6">
     <b>Reviewer</b></div>
  <div class="box " style="left:884px;top:378px;--accent:#4ade80">
     <b>Tests</b></div>
  <div class="mono" style="position:absolute;left:300px;top:120px;font-size:14px;color:#fbbf24">
    hands work over</div>
  <div class="mono" style="position:absolute;left:706px;top:126px;font-size:14px;color:#4ade80">
    reports back</div>
  <div class="mono" style="position:absolute;left:330px;top:492px;font-size:14px;color:#60a5fa">
    asks a question, mid-task</div>
  <div class="sub" style="top:600px">
    Delegating, handing off, and pushing back — several at once, not one after another.</div>
</div></body></html>
